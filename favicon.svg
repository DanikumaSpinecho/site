<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mitigoke">
  <rect width="64" height="64" rx="14" fill="#0a0e13"/>
  <!-- Le bouclier : ce que fait une mitigation. -->
  <path d="M32 10 L52 18 v16 c0 12-8 20-20 24-12-4-20-12-20-24V18z"
        fill="none" stroke="#4da3ff" stroke-width="4" stroke-linejoin="round"/>
  <!-- L'aiguille du compte a rebours : ce que fait un prompteur. -->
